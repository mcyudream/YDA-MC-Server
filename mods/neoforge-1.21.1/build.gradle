plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

base {
    archivesName = "${mod_id}-neoforge-1.21.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.main.java.srcDir project(':core').file('src/main/java')

neoForge {
    version = '21.1.235'

    runs {
        server {
            server()
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.console.level', 'debug'
        }
    }

    mods {
        yudream_minecraft_server {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : '1.21.1',
            minecraft_version_range: '[1.21.1,1.21.2)',
            neo_version            : '21.1.235',
            neo_version_range      : '[21.1,)',
            loader_version_range   : '[4,)',
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
