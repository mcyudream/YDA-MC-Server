plugins {
    id 'java'
}

// Velocity 3.5.x requires Java 21, so the plugin is built to Java 21 bytecode. The shared core is
// still compiled separately for consumers that need lower bytecode.
def javaRelease = (findProperty('velocity_java_release') ?: '21') as int
java {
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaRelease
}

// The shared bridge core is compiled straight into this jar, the same convention mods/* uses.
// It keeps the plugin a single self-contained file with no shading step.
sourceSets.main.java.srcDir project(':common').file('src/main/java')

dependencies {
    compileOnly "com.velocitypowered:velocity-api:${velocity_api_version}"
    annotationProcessor "com.velocitypowered:velocity-api:${velocity_api_version}"
}

// The @Plugin annotation processor writes velocity-plugin.json; fail loudly if it ever stops doing so.
tasks.named('jar', Jar).configure {
    archiveBaseName = 'yudream-velocity'
    doLast {
        def descriptor = zipTree(archiveFile.get().asFile).matching { include 'velocity-plugin.json' }.files
        if (descriptor.isEmpty()) {
            throw new GradleException('velocity-plugin.json was not generated; check the velocity-api annotation processor.')
        }
    }
}
