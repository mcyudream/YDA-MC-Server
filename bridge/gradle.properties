org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

project_group=online.yudream.minecraft
project_version=1.1.0

# Velocity proxy plugin. Velocity 3.5.x runs on Java 21, so the plugin targets Java 21 bytecode.
# Check the current version on https://jd.papermc.io/velocity/
velocity_api_version=3.5.0-SNAPSHOT
velocity_java_release=21

# Fabric sensor mod. Check these on https://fabricmc.net/develop
minecraft_version=26.2
# The loader the build runs against. This is NOT the version the mod requires — see below.
loader_version=0.19.5
# The oldest loader the built mod declares it needs. Fabric shipped 0.19.3 as the player-facing
# loader for Minecraft 26.2, and the mod only uses APIs that predate it, so requiring the build's
# own loader version would block servers that are perfectly able to run it.
loader_min_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.160.0+26.2

# Minecraft 26.2 ships unobfuscated, so no mappings declaration is required by Loom 1.17.
fabric_java_release=25

mod_id=yudream_minecraft_server
mod_name=YuDream Minecraft Server Bridge (Fabric sensor)
mod_license=MIT
mod_authors=YuDream
mod_description=Reports backend player activity to the YuDream Velocity bridge through a plugin message channel.
